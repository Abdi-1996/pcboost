name: Build PC Boost for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish standalone EXE
        shell: pwsh
        run: >-
          dotnet publish PCBoostOptimizer.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Upload PC Boost EXE
        uses: actions/upload-artifact@v4
        with:
          name: PCBoostOptimizer-win-x64
          path: publish/PCBoostOptimizer.exe
          if-no-files-found: error
